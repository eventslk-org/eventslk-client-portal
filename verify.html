<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Email | EventXP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=3">
    <style>
        .verify-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .verify-card { width: 100%; max-width: 460px; padding: 3rem 2.5rem; text-align: center; }
        .verify-icon { font-size: 3.5rem; margin-bottom: 1rem; }
        .verify-card h2 { font-size: 1.75rem; margin-bottom: 0.75rem; }
        .verify-card p { color: var(--text-muted); margin-bottom: 1.5rem; }
        .spinner {
            width: 40px; height: 40px; margin: 0 auto 1.5rem;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .resend-row { margin-top: 1rem; }
        .resend-row input {
            width: 100%; padding: 0.75rem 1rem; margin-bottom: 0.75rem;
            background: rgba(0,0,0,0.3); border: 1px solid var(--surface-border);
            border-radius: 0.75rem; color: #fff;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="verify-wrap">
        <div class="glass-card verify-card">
            <div id="loadingState">
                <div class="spinner"></div>
                <h2>Verifying your email…</h2>
                <p>Hang tight while we confirm your address.</p>
            </div>

            <div id="resultState" class="hidden">
                <div class="verify-icon" id="resultIcon">✅</div>
                <h2 id="resultTitle">Email verified!</h2>
                <p id="resultMessage">Your account is ready. You can now sign in.</p>
                <a href="/auth.html" class="btn btn-primary" style="width:100%;">Go to Sign In</a>

                <!-- Resend block, shown when the token is expired/invalid -->
                <div id="resendBlock" class="resend-row hidden">
                    <input type="email" id="resendEmail" placeholder="Enter your email to resend">
                    <button class="btn btn-outline" style="width:100%;" id="resendBtn">Resend verification email</button>
                    <p id="resendStatus" style="margin-top:0.75rem;"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="/env-config.js"></script>
    <script src="/js/api.js?v=3"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        function show(icon, title, message, showResend) {
            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('resultState').classList.remove('hidden');
            document.getElementById('resultIcon').textContent = icon;
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMessage').textContent = message;
            document.getElementById('resendBlock').classList.toggle('hidden', !showResend);
        }

        async function runVerification() {
            if (!token) {
                show('⚠️', 'Missing token', 'This verification link is incomplete. Please use the link from your email.', true);
                return;
            }
            try {
                const res = await api.verifyEmail(token);
                switch (res.message) {
                    case 'success':
                        show('✅', 'Email verified!', 'Your account is ready. You can now sign in.', false);
                        break;
                    case 'already verified':
                        show('✅', 'Already verified', 'This email was already verified. You can sign in.', false);
                        break;
                    case 'token expired':
                        show('⏰', 'Link expired', 'This verification link has expired. Request a new one below.', true);
                        break;
                    default:
                        show('⚠️', 'Invalid link', 'This verification link is not valid. Request a new one below.', true);
                }
            } catch (err) {
                // verify-email returns non-2xx for expired/invalid — surface a resend path.
                const msg = (err.message || '').toLowerCase();
                if (msg.includes('expired')) {
                    show('⏰', 'Link expired', 'This verification link has expired. Request a new one below.', true);
                } else {
                    show('⚠️', 'Verification failed', err.message || 'Could not verify this link. Request a new one below.', true);
                }
            }
        }

        document.getElementById('resendBtn').addEventListener('click', async () => {
            const email = document.getElementById('resendEmail').value.trim();
            const status = document.getElementById('resendStatus');
            if (!email) { status.textContent = 'Please enter your email address.'; return; }
            const btn = document.getElementById('resendBtn');
            btn.disabled = true; btn.textContent = 'Sending…';
            try {
                await api.resendVerification(email);
                status.textContent = `Verification email re-sent to ${email}.`;
            } catch (err) {
                status.textContent = 'Could not resend: ' + err.message;
            } finally {
                btn.disabled = false; btn.textContent = 'Resend verification email';
            }
        });

        runVerification();
    </script>
</body>
</html>
