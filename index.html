<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Events | EventXP</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=2">
    <style>
        .event-img-placeholder {
            height: 180px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 1rem 1rem 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
            font-size: 3rem;
        }
        .event-details {
            padding: 1.5rem;
        }
        .event-title { margin-bottom: 0.5rem; font-size: 1.25rem; }
        .event-meta {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">EventXP</a>
            <div class="nav-links" id="navLinks">
                <!-- Rendered by JS based on Auth state -->
            </div>
        </div>
    </nav>

    <header class="hero container">
        <h1>Discover amazing <br>experiences.</h1>
        <p>Book your spot at the most anticipated events, conferences, and meetups around the globe.</p>
    </header>

    <main class="container">
        <div class="grid" id="eventsGrid">
            <!-- Events loaded here -->
            <p class="text-muted" style="text-align:center; grid-column: 1 / -1;">Loading events...</p>
        </div>
    </main>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal-overlay" style="display: none;">
        <div class="glass-card modal-content">
            <h2 id="modalEventName" style="margin-bottom: 1rem; font-size: 1.5rem;">Event Name</h2>
            <div class="modal-body" style="margin-bottom: 2rem; color: var(--text-muted);">
                <p style="margin-bottom: 0.5rem;">📍 <strong>Place:</strong> <span id="modalLocation"></span></p>
                <p style="margin-bottom: 0.5rem;">🕒 <strong>Date:</strong> <span id="modalDate"></span></p>
                <p style="margin-bottom: 0.5rem;">👥 <strong>Available Seats:</strong> Checking availability...</p>
                <p style="margin-bottom: 0.5rem;">📝 <strong>Details:</strong> <span id="modalDescription"></span></p>
            </div>
            <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 1rem;">
                <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="confirmBookBtn">Confirm Booking</button>
            </div>
        </div>
    </div>

    <script src="env-config.js"></script>
    <script src="js/api.js?v=3"></script>
    <script>
        // Setup Nav
        const navLinks = document.getElementById('navLinks');
        if (api.isAuthenticated()) {
            navLinks.innerHTML = `
                <a href="profile.html" class="nav-link">My Bookings (${api.user.username})</a>
                <button onclick="api.logout()" class="btn btn-outline" style="padding: 0.5rem 1rem;">Logout</button>
            `;
        } else {
            navLinks.innerHTML = `
                <a href="auth.html" class="btn btn-outline" style="padding: 0.5rem 1rem; border: none;">Sign In</a>
                <a href="auth.html?mode=register" class="btn btn-primary" style="padding: 0.5rem 1rem;">Get Started</a>
            `;
        }

        async function loadEvents() {
            try {
                const res = await api.getEvents();
                const events = res.eventList || [];
                const grid = document.getElementById('eventsGrid');
                grid.innerHTML = '';
                
                if (events.length === 0) {
                    grid.innerHTML = '<p class="text-muted" style="text-align:center; grid-column: 1 / -1;">No upcoming events available right now.</p>';
                    return;
                }

                window.eventsData = events; // Save globally for modal access
                events.forEach(ev => {
                    const card = document.createElement('div');
                    card.className = 'glass-card';
                    card.style.display = 'flex';
                    card.style.flexDirection = 'column';
                    card.style.height = '100%';
                    
                    card.innerHTML = `
                        <div class="event-img-placeholder">🎫</div>
                        <div class="event-details" style="display: flex; flex-direction: column; flex: 1; padding: 1.5rem;">
                            <h3 class="event-title">${ev.name}</h3>
                            <div class="event-meta" style="margin-bottom: 1.5rem;">
                                <span>📍 ${ev.location || 'TBA'}</span>
                            </div>
                            <div style="margin-top: auto;">
                                <button class="btn btn-primary" style="width: 100%;" onclick="openBookingModal('${ev.eventId}')">
                                    Target Ticket
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) {
                console.error(e);
                document.getElementById('eventsGrid').innerHTML = '<p class="text-muted" style="text-align:center; grid-column: 1 / -1;">Could not load events.</p>';
            }
        }

        let selectedEventId = null;

        function openBookingModal(eventId) {
            if (!api.isAuthenticated()) {
                window.location.href = 'auth.html?redirect=index.html';
                return;
            }
            
            selectedEventId = eventId;
            const ev = window.eventsData.find(e => e.eventId === eventId);
            if (!ev) return;
            
            const dateStr = ev.dates && ev.dates.length > 0
                ? new Date(ev.dates[0]).toLocaleString()
                : 'TBA';
                
            document.getElementById('modalEventName').textContent = ev.name;
            document.getElementById('modalLocation').textContent = ev.location || 'TBA';
            document.getElementById('modalDate').textContent = dateStr;
            document.getElementById('modalDescription').textContent = ev.description || 'No description provided.';
            
            document.getElementById('bookingModal').style.display = 'flex';
            
            // Setup confirm action
            const confirmBtn = document.getElementById('confirmBookBtn');
            confirmBtn.onclick = () => confirmBooking(eventId);
        }

        function closeModal() {
            document.getElementById('bookingModal').style.display = 'none';
            selectedEventId = null;
        }

        async function confirmBooking(eventId) {
            const confirmBtn = document.getElementById('confirmBookBtn');
            confirmBtn.disabled = true;
            confirmBtn.textContent = 'Booking...';
            
            try {
                await api.bookEvent(eventId, api.user.userId);
                alert("Boom! Ticket successfully booked!");
                closeModal();
                loadEvents(); // Reload to update any potential availability
            } catch(e) {
                alert("Failed to book event. " + e.message);
            } finally {
                confirmBtn.disabled = false;
                confirmBtn.textContent = 'Confirm Booking';
            }
        }

        loadEvents();
    </script>
</body>
</html>
