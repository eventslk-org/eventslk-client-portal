server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static client portal. All API traffic goes directly to the API Gateway at
    # window.ENV.API_BASE_URL (see env-config.js); the gateway handles CORS, so no
    # /api reverse-proxy is needed here.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Emailed verification links point at {APP_BASE_URL}/auth/verify-email?token=...
    # Set the backend APP_BASE_URL to this portal's public URL and the link lands
    # on the friendly verify page, which reads ?token= and calls the gateway.
    location = /auth/verify-email {
        rewrite ^ /verify.html last;
    }

    # Never cache the runtime config so a repointed API_BASE_URL takes effect immediately.
    location = /env-config.js {
        add_header Cache-Control "no-store";
    }
}
